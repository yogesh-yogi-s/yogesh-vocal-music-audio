name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-lock:
    name: Python 3.13 hashed lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run test suite
        run: python -m pytest -q --basetemp "${{ runner.temp }}/pytest" -o cache_dir="${{ runner.temp }}/pytest-cache" tests
      - name: Check frontend JavaScript syntax
        run: node --check frontend/js/app.js
      - name: Check patch whitespace
        run: git diff --check

  compatibility-python-312:
    name: Python 3.12 ranged compatibility (not exact-lock evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install ranged compatibility dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run compatibility suite
        run: python -m pytest -q --basetemp "${{ runner.temp }}/pytest" -o cache_dir="${{ runner.temp }}/pytest-cache" tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and install the vma library
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
      - name: Import the installed library from outside the repository
        working-directory: ${{ runner.temp }}
        run: python -c "import vma; print(vma.__all__)"
