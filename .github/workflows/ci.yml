name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest -q
      - name: Check frontend JavaScript syntax
        run: node --check frontend/js/app.js

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and install the vma library
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
      - name: Import the installed library from outside the repository
        working-directory: ${{ runner.temp }}
        run: python -c "import vma; print(vma.__all__)"
