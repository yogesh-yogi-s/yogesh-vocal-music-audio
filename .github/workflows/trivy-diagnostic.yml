name: Trivy diagnostic (manual)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to scan
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    name: Build and classify Trivy findings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Require trusted workflow ref
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "This diagnostic must run from the trusted refs/heads/main workflow ref." >&2
            exit 2
          fi

      - name: Validate selected commit
        shell: bash
        env:
          SELECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SELECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character commit SHA." >&2
            exit 2
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Confirm checkout and build image
        shell: bash
        env:
          SELECTED_SHA: ${{ inputs.commit_sha }}
          IMAGE_TAG: vma-trivy-diagnostic:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "${checked_out_sha,,}" != "${SELECTED_SHA,,}" ]]; then
            echo "Checkout SHA does not match the requested commit." >&2
            exit 2
          fi
          echo "Verified commit: $checked_out_sha"
          docker buildx version
          docker buildx build --load --tag "$IMAGE_TAG" .
          echo "Built local image ID: $(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"

      - name: Scan and print only HIGH/CRITICAL findings
        shell: bash
        env:
          IMAGE_TAG: vma-trivy-diagnostic:${{ github.run_id }}-${{ github.run_attempt }}
          TRIVY_VERSION: 0.76.0
        run: |
          set -euo pipefail
          report_dir="$(mktemp -d "$RUNNER_TEMP/trivy-diagnostic.XXXXXX")"
          cleanup() {
            docker image rm "$IMAGE_TAG" >/dev/null 2>&1 || true
            rm -f "$report_dir/trivy.json"
            rmdir "$report_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$report_dir:/reports" \
            "aquasec/trivy:$TRIVY_VERSION" image \
            --scanners vuln --format json --output /reports/trivy.json "$IMAGE_TAG"

          python3 - "$report_dir/trivy.json" <<'PY'
          import csv
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              report = json.load(report_file)

          if not isinstance(report, dict) or not isinstance(report.get("Results"), list) or not report["Results"]:
              raise SystemExit("Trivy report must contain non-empty scan results.")

          rows = []
          for result in report["Results"]:
              if not isinstance(result, dict) or not all(isinstance(result.get(key), str) and result[key] for key in ("Type", "Target")):
                  raise SystemExit("Trivy scan result is missing its type or target.")
              findings = result.get("Vulnerabilities")
              if findings is None:
                  findings = []
              if not isinstance(findings, list):
                  raise SystemExit("Trivy vulnerabilities must be a list.")
              for finding in findings:
                  if not isinstance(finding, dict) or not all(isinstance(finding.get(key), str) and finding[key] for key in ("VulnerabilityID", "PkgName", "InstalledVersion", "Severity")):
                      raise SystemExit("Trivy finding is missing required identification fields.")
                  severity = finding["Severity"]
                  if severity not in {"UNKNOWN", "LOW", "MEDIUM", "HIGH", "CRITICAL"}:
                      raise SystemExit("Trivy finding has an unrecognized severity.")
                  if "FixedVersion" in finding and not isinstance(finding["FixedVersion"], str):
                      raise SystemExit("Trivy fixed version must be a string when present.")
                  if severity not in {"HIGH", "CRITICAL"}:
                      continue
                  rows.append((
                      finding.get("VulnerabilityID", ""),
                      finding.get("PkgName", ""),
                      finding.get("InstalledVersion", ""),
                      finding.get("FixedVersion") or "-",
                      severity,
                      result.get("Type", ""),
                      result.get("Target", ""),
                  ))

          rows.sort(key=lambda row: (row[4], row[0], row[1], row[5], row[6]))
          print(f"HIGH/CRITICAL findings: {len(rows)}")
          writer = csv.writer(sys.stdout, delimiter="\t", lineterminator="\n")
          writer.writerow(("CVE", "Package", "Installed", "Fixed", "Severity", "Type", "Target"))
          writer.writerows(rows)
          if rows:
              raise SystemExit(1)
          PY
