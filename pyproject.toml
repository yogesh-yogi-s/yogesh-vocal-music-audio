[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vma"
version = "0.3.0"
description = "VMA (Vocal Music Audio) — a versioned binary container for synchronized vocal and music audio streams, with reader, writer, and extractor libraries."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "yogesh-s" }]
keywords = ["audio", "container", "wav", "stems", "vocal", "instrumental", "binary-format"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
app = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.12,<1.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://github.com/yogesh-yogi-s/yogesh-vocal-music-audio"
Repository = "https://github.com/yogesh-yogi-s/yogesh-vocal-music-audio"
Documentation = "https://github.com/yogesh-yogi-s/yogesh-vocal-music-audio/tree/main/docs"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["vma*"]
